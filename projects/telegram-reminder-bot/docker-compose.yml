services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reminders
      POSTGRES_USER: reminders
      POSTGRES_PASSWORD: reminders
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reminders -d reminders"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    build:
      context: .
      dockerfile: v2/Dockerfile
    command: ["python", "bot-v2.py"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://reminders:reminders@postgres:5432/reminders
      REDIS_URL: redis://redis:6379/0
      BOT_TIMEZONE: Europe/Prague
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: v2/Dockerfile
    command: ["python", "-m", "app.scheduler"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://reminders:reminders@postgres:5432/reminders
      REDIS_URL: redis://redis:6379/0
      BOT_TIMEZONE: Europe/Prague
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  notifier:
    build:
      context: .
      dockerfile: v2/Dockerfile
    command: ["python", "-m", "app.notifier"]
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://reminders:reminders@postgres:5432/reminders
      REDIS_URL: redis://redis:6379/0
      BOT_TIMEZONE: Europe/Prague
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: v2/Dockerfile
    command: ["uvicorn", "v2.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: postgresql+asyncpg://reminders:reminders@postgres:5432/reminders
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
