name: Identity Access API tests

on:
  push:
    paths:
      - 'projects/identity-access-api/**'
      - '.github/workflows/identity-access-api.yml'
  pull_request:
    paths:
      - 'projects/identity-access-api/**'
      - '.github/workflows/identity-access-api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/identity-access-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: pytest -q
